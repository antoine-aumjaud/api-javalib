name: java build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

jobs:
  build:
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'java build (release)' || format('java build ({0})', github.event.head_commit.message) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@v5

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'gradle'

    - name: Build and test
      # --no-daemon: daemon is useless on CI (fresh env each run)
      # JAVA_TOOL_OPTIONS: suppress native access warning from Gradle's native-platform on Java 25+
      run: ./gradlew --no-daemon clean build
      env:
        JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED

    - name: Publish JAR to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/*.jar