name: java build
run-name: "${{ startsWith(github.ref, 'refs/tags/') && format('RELEASE {0}', github.ref_name) || github.event.head_commit.message }}"


on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout sources
      uses: actions/checkout@v5

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'gradle'

    - name: Build and test
      # --no-daemon: daemon is useless on CI (fresh env each run)
      run: ./gradlew --no-daemon clean build

    - name: Publish JAR to GitHub Release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        files: build/libs/*.jar