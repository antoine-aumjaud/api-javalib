plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

def versions = [
    springBoot : '3.3.6',
    spark      : '2.9.4',
    slf4j      : '2.0.16',
    gson       : '2.11.0',
    bcpkix     : '1.80',
    jwt        : '4.5.0',
    logback    : '1.5.8',
    junit4     : '4.13.2'
]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Spark server
    implementation("com.sparkjava:spark-core:${versions.spark}") {
        exclude group: 'org.slf4j'
    }
    // Spring (context -> bean -> core)
    implementation("org.springframework.boot:spring-boot-starter-web:${versions.springBoot}") {
        exclude group: 'commons-logging'
    }
    implementation("org.springframework.boot:spring-boot-starter-validation:${versions.springBoot}")

    // Common
    implementation "org.slf4j:slf4j-api:${versions.slf4j}"
    implementation "com.google.code.gson:gson:${versions.gson}"
    implementation "org.bouncycastle:bcpkix-jdk18on:${versions.bcpkix}"
    implementation "com.auth0:java-jwt:${versions.jwt}"

    // Tests
    testImplementation "junit:junit:${versions.junit4}"
    testRuntimeOnly "ch.qos.logback:logback-classic:${versions.logback}"
}

tasks.named('jar') {
    archiveBaseName = 'api-javalib'
    archiveVersion = '1.14.1'
}
